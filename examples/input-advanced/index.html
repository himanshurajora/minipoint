<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Input Demo - Minipoint</title>
    <link rel="stylesheet" href="../public/styles.css">
    <style>
        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #0f0;
            z-index: 100;
        }
        canvas {
            display: block;
            background: #1a1a2e;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div style="color: #0f0; margin-bottom: 10px;">ADVANCED INPUT</div>
        <div style="font-size: 11px;">
            <div>Keyboard: WASD, Arrows, Space, Shift</div>
            <div>Mouse: Move, Click, Drag</div>
            <div style="margin-top: 10px;">
                <div id="info"></div>
            </div>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="script.ts"></script>
</body>
</html>
