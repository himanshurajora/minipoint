<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Utilities Demo - Minipoint</title>
    <link rel="stylesheet" href="../public/styles.css">
    <style>
        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            padding: 15px;
            font-family: monospace;
            font-size: 11px;
            border: 1px solid #0f0;
            z-index: 100;
            max-width: 300px;
        }
        canvas {
            display: block;
            background: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div style="color: #0f0; margin-bottom: 10px;">COLOR UTILITIES</div>
        <div style="font-size: 10px; line-height: 1.6;">
            <div>Click canvas to sample colors</div>
            <div id="info"></div>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="script.ts"></script>
</body>
</html>
